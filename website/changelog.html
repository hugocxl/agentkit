{{head title="Changelog · AgentKit" canonical="changelog.html" description="Every AgentKit release, with what it added, changed and fixed."}}
</head>
<body class="ds" data-layout="plain">
{{masthead}}
  <main>
    <article class="ds-column ds-opening">
      <hgroup class="ds-title">
        <h1>Changelog</h1>
        <p>Every release of the package</p>
      </hgroup>
      <ul class="ds-meta">
        <li class="ds-label">Version {{version}}</li>
        <li class="ds-label"><time datetime="{{release-datetime}}">{{release-date}}</time></li>
      </ul>
{{changelog}}
    </article>
  </main>
{{footer}}
</body>
</html>
