name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: agentkit-release
  cancel-in-progress: false

jobs:
  release:
    permissions:
      contents: write
    uses: hugocxl/stack/.github/workflows/reusable-release-tag.yml@main
    with:
      app-name: AgentKit
      run-validate: true
    secrets: inherit
